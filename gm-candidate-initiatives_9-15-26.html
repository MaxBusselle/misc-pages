<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wentzville Candidate Initiatives</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andada+Pro:wght@400;600&family=Sen:wght@400;700&family=Geist+Mono:wght@400;500&display=swap">
</head>
<body>
<style>
  :root{
    --paper:#141211; --surface:#1e1b19; --surface-2:#292522;
    --ink:#f4f1eb; --muted:#aaa196; --line:#3c3630; --line-strong:#60574c;
    --blue:#3fa8d4; --blue-dim:#2a7ea0; --orange:#f99c24; --cream:#ebe5dc;
    --serif:"Andada Pro",Georgia,"Times New Roman",serif;
    --sans:"Sen","Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"Geist Mono","SFMono-Regular",Menlo,Consolas,monospace;
    --ease:cubic-bezier(.16,1,.3,1);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{background:var(--paper)}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:36px 64px}
  a{color:var(--blue)}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:2px}
  .mono{font-family:var(--mono);font-size:13px;letter-spacing:.04em}
  .eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}

  /* header */
  header h1{font:400 clamp(30px,4.6vw,44px)/1.1 var(--serif);margin:10px 0 14px;text-wrap:balance;letter-spacing:-.005em}
  .built{color:var(--muted);margin:0 0 26px;max-width:62ch}
  .how{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 28px;margin:0 0 32px;padding:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .how p{margin:0;max-width:34ch}
  .how p b{display:block;font:600 17px/1.3 var(--serif);margin-bottom:4px}
  @media (max-width:720px){.how{grid-template-columns:1fr}}

  /* overview grid */
  .overview{display:grid;grid-template-columns:minmax(150px,1.3fr) repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:0 0 14px}
  .overview>div{background:var(--paper);padding:12px 14px;min-height:52px}
  .overview .hd{background:var(--surface);color:var(--muted);font-family:var(--mono);font-size:13px;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:flex-end}
  .overview .rowlab{background:var(--surface);font:600 17px/1.25 var(--serif);display:flex;flex-direction:column;justify-content:center;gap:2px}
  .overview .rowlab small{font:400 13px var(--mono);color:var(--muted);letter-spacing:.05em}
  .overview button.cell{display:flex;width:100%;height:100%;align-items:baseline;justify-content:space-between;gap:8px;text-align:left;padding:2px 0;transition:color .3s var(--ease)}
  .overview button.cell:hover{color:var(--blue)}
  .overview button.cell .n{font:500 22px/1 var(--mono);color:var(--ink)}
  .overview button.cell:hover .n{color:var(--blue)}
  .overview button.cell .open{font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.04em}
  .overview button.cell.dim .n{color:var(--muted)}
  @media (max-width:720px){
    .overview{grid-template-columns:1fr}
    .overview .hd{display:none}
    .overview button.cell::before{content:attr(data-aud);font-family:var(--mono);font-size:13px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-right:auto}
    .overview button.cell{justify-content:flex-start;gap:14px}
  }
  .legend{display:flex;flex-wrap:wrap;gap:8px 26px;color:var(--muted);font-size:14px;margin:0 0 44px}
  .legend span{display:inline-flex;align-items:center;gap:8px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);display:inline-block;flex:none}
  .tag{font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--cream);border:1px solid var(--cream);border-radius:2px;padding:1px 6px;white-space:nowrap}
  .tag.sample{opacity:.85}

  /* tabs */
  .tabs{display:flex;gap:0 28px;border-bottom:1px solid var(--line-strong);margin:0 0 22px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{font:400 22px/1.2 var(--serif);color:var(--muted);padding:10px 2px 12px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:baseline;gap:10px;transition:color .3s var(--ease),border-color .3s var(--ease)}
  .tab small{font:400 13px var(--mono);letter-spacing:.06em;color:var(--muted)}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
  .tab:hover{color:var(--ink)}
  .program-line{font:400 19px/1.45 var(--serif);margin:0 0 26px;max-width:60ch;color:var(--ink)}

  /* audience slides */
  .slidebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:0 0 6px}
  .seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
  .seg button{padding:7px 14px;color:var(--muted);border-right:1px solid var(--line-strong);transition:background .3s var(--ease),color .3s var(--ease)}
  @media (max-width:720px){.seg{display:flex;width:100%}.seg button{flex:1 1 0;padding:8px 6px;font-size:14px;text-align:center;white-space:normal}.slidebar>*{max-width:100%}.sortbtn{margin-left:0}}
  .seg button:last-child{border-right:0}
  .seg button[aria-selected="true"]{background:var(--surface-2);color:var(--ink)}
  .arrows{display:inline-flex;gap:6px}
  .arrows button{width:34px;height:34px;border:1px solid var(--line-strong);border-radius:3px;color:var(--muted);display:grid;place-items:center;font-family:var(--mono)}
  .arrows button:hover{color:var(--ink);border-color:var(--ink)}
  .sortbtn{margin-left:auto;font-family:var(--mono);font-size:13px;letter-spacing:.05em;color:var(--blue);padding:8px 0}
  .sortbtn[aria-pressed="true"]{color:var(--ink)}
  .sortbtn[aria-pressed="true"]::before{content:"■ ";color:var(--blue)}
  .who{color:var(--muted);margin:0 0 6px;font-size:14px}

  .items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
  .item{border-bottom:1px solid var(--line)}
  .item-head{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;padding:15px 2px}
  .item-head .num{font:500 13px/1.7 var(--mono);color:var(--muted);min-width:22px;letter-spacing:.04em}
  .item-head .name{font:400 19px/1.3 var(--serif);flex:1 1 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
  .item-head .chev{color:var(--muted);font-family:var(--mono);transition:transform .3s var(--ease);margin-top:4px}
  .item[data-open="true"] .item-head .chev{transform:rotate(90deg)}
  .item-head:hover .name{color:var(--blue)}
  .detail{display:none;padding:0 2px 18px 36px}
  .item[data-open="true"] .detail{display:block}
  .dgrid{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:14px 28px}
  .dgrid>div{max-width:52ch}
  .dgrid .lab,.gmq .lab{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .gmq{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line-strong);max-width:62ch}
  .gmq .lab{color:var(--orange)}
  .gmq p{margin:0;font:400 17px/1.45 var(--serif)}
  .fold{margin-top:10px;color:var(--muted);font-size:14px}
  @media (max-width:720px){.dgrid{grid-template-columns:1fr}.detail{padding-left:2px}}

  /* sort mode */
  .sortrow{display:none;align-items:center;gap:10px;padding:0 2px 14px 36px}
  .slide[data-sort="true"] .sortrow{display:flex;flex-wrap:wrap}
  .slide[data-sort="true"] .item-head{padding-bottom:8px}
  .mv{width:30px;height:30px;border:1px solid var(--line-strong);border-radius:3px;color:var(--muted);font-family:var(--mono);display:grid;place-items:center}
  .mv:hover{color:var(--ink);border-color:var(--ink)}
  .mv:disabled{opacity:.3;cursor:default}
  .why{flex:1 1 240px;background:var(--surface);border:1px solid var(--line-strong);border-radius:3px;color:var(--ink);padding:7px 10px;font:15px var(--sans)}
  .why::placeholder{color:var(--muted)}
  .tools{display:none;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 2px 0}
  .slide[data-sort="true"] .tools{display:flex}
  .copy{font-family:var(--mono);font-size:13px;letter-spacing:.05em;color:var(--ink);border:1px solid var(--line-strong);border-radius:3px;padding:8px 12px}
  .copy:hover{border-color:var(--ink)}
  .status{color:var(--muted);font-size:14px}
  .copyout{display:none;width:100%;min-height:140px;background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);font:14px/1.5 var(--mono);padding:10px;margin-top:10px;border-radius:3px}
  .copyout.show{display:block}
  @media (max-width:720px){.sortrow{padding-left:2px}}

  /* band */
  .band{margin:56px 0 0;padding:26px 0 0;border-top:1px solid var(--line-strong)}
  .band h2{font:400 24px/1.2 var(--serif);margin:6px 0 6px}
  .band .note{color:var(--muted);margin:0 0 18px;max-width:62ch}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chips details{border:1px solid var(--line-strong);border-radius:3px;background:var(--surface)}
  .chips summary{list-style:none;cursor:pointer;padding:8px 14px;font:400 16px var(--sans);color:var(--ink)}
  .chips summary::-webkit-details-marker{display:none}
  .chips details[open]{flex-basis:100%}
  .chips details[open] summary{border-bottom:1px solid var(--line);color:var(--blue)}
  .chips .body{padding:12px 14px 14px;max-width:70ch}
  .chips .body p{margin:0}
  .chips .body .gm{margin-top:8px;color:var(--cream);font:400 16px/1.45 var(--serif)}

  /* left off */
  .leftoff{margin:36px 0 0}
  .leftoff summary{cursor:pointer;font:400 18px var(--serif);color:var(--muted);list-style:none;display:inline-flex;gap:10px;align-items:baseline}
  .leftoff summary::-webkit-details-marker{display:none}
  .leftoff summary::before{content:"+";font-family:var(--mono);color:var(--blue)}
  .leftoff[open] summary::before{content:"–"}
  .leftoff[open] summary{color:var(--ink)}
  .leftoff dl{margin:16px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:10px 22px;max-width:76ch}
  .leftoff dt{font:600 16px var(--serif)}
  .leftoff dd{margin:0;color:var(--muted)}
  @media (max-width:720px){.leftoff dl{grid-template-columns:1fr;gap:4px}.leftoff dd{margin-bottom:8px}}

  .group-hd{list-style:none;padding:26px 2px 8px;font:400 17px/1.3 var(--serif);color:var(--blue)}
  .group-hd:first-child{padding-top:14px}
  .ex{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-strong)}
  .ex .lab{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .ex .pn{font:400 17px/1.4 var(--serif);margin:0 0 4px}
  .ex .ev{color:var(--muted);font-size:14px;margin:4px 0 0}
  .ex button.where{color:var(--blue);font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-align:left}
  .ex button.where:hover{color:var(--ink)}
  /* the band's cross-reference */
  .appears{margin-top:10px;color:var(--muted);font-size:14px}
  .appears ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
  .appears button{text-align:left;color:var(--ink);font-size:15px;line-height:1.4}
  .appears button:hover{color:var(--blue)}
  .appears button small{color:var(--muted);font-family:var(--mono);font-size:12px;letter-spacing:.04em;margin-left:8px}
  footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="h1"></h1>
    <p class="built" id="built"></p>
    <div class="how" id="how"></div>
    <div class="overview" id="overview" aria-label="All programs and roles"></div>
    <div class="legend" id="legend"></div>
  </header>

  <nav class="tabs" role="tablist" id="tabs" aria-label="Programs"></nav>
  <section class="program" aria-live="polite">
    <p class="program-line" id="pline"></p>
    <div class="slidebar">
      <div class="seg" role="tablist" id="seg" aria-label="Roles"></div>
      <button type="button" class="sortbtn" id="sortbtn" aria-pressed="false">Sort this list</button>
    </div>
    <div class="slide" id="slide" data-sort="false">
      <p class="who" id="who"></p>
      <ul class="items" id="items"></ul>
      <div class="tools">
        <button type="button" class="copy" id="copy">Copy this list as sorted</button>
        <span class="status" id="status"></span>
        <textarea class="copyout" id="copyout" readonly aria-label="The sorted list as text"></textarea>
      </div>
    </div>
  </section>

  <section class="band" id="band"></section>
  <details class="leftoff" id="leftoff"></details>

  <footer>
    <span>Flint · 14 September 2026</span>
    <span>GM's own words throughout. No figure on this page is ours.</span>
  </footer>
</div>

": "The rotation schedule", "does": "Building rotation with operator input and keeping the flex chart current.", "often": "Weekly.", "source": "Roles deck."}], "gl": [{"name": "The safety talk and the Take 2 message", "does": "Delivering the weekly safety topic and the Take 2 message before non-cyclic work.", "often": "Weekly.", "source": "Roles deck; STS task 1 note.", "role": "own"}, {"name": "The safety observation tour with a team leader", "does": "Doing the tour alongside a team leader and coaching theirs.", "often": "Weekly.", "source": "Roles deck; STS task 1.", "role": "part", "partOf": "The safety observation tour"}, {"name": "The incident, near miss and medical visit investigation", "does": "Investigating to cause, entering it in Cority, closing the countermeasure.", "often": "Weekly time budgeted.", "source": "Roles deck; STS task 2.", "role": "own"}, {"name": "The layered audit on safety-critical elements", "does": "Auditing the safety-critical job elements with the team leader.", "often": "Weekly.", "source": "Roles deck.", "role": "own"}, {"name": "Employee safety concerns", "does": "Reacting to a concern through the employee safety concern (ESC) process.", "often": "When raised. No fixed hook.", "source": "Roles deck.", "role": "own"}, {"name": "Hazard assessments and PPE instructions", "does": "Doing the hazard assessment and keeping PPE instructions present and followed.", "often": "Monthly.", "source": "Roles deck; STS task 44.", "role": "own", "fold": "Weak hook. Folds into the safety observation tour."}], "tm": [{"name": "The 5S tasks", "does": "\"Perform 5S tasks and maintain workplace organization.\"", "often": "", "source": "Roles deck, team member slide."}, {"name": "The near miss report", "does": "\"Submit near miss reports.\"", "often": "", "source": "Roles deck, team member slide."}]}}, {"id": "quality", "name": "Quality", "letter": "Q", "line": "GM's Quality column. The group leader slide reads: \"Do not Accept, Build, or Ship Defects.\"", "cells": {"tl": [{"name": "The andon call", "does": "Getting up on the team's tone, before the line stops.", "often": "Eight calls a day budgeted on the J1 sheet.", "source": "STS task 11; roles deck; 10 Sep call.", "gm": "\"They wait till the line completely stops instead of getting up off their desk.\" Mariam Ellinger-Baker."}, {"name": "Repairs in the area", "does": "Owning the repair, tracing it to its station and feeding back to the operator.", "often": "Three to six a shift at minimum.", "source": "10 Sep call; roles deck.", "gm": "\"Oh, that's not my repair.\" Dave Elliott, on the repair that escapes the area and gets covered up."}, {"name": "The daily quality focus check (QFC)", "does": "Checking the build against the standard and acting on what it returns.", "often": "Daily.", "source": "STS task 13; 10 Sep call."}, {"name": "A new operator on an unfamiliar job", "does": "Training with job instruction training (JIT) and staying with them on the new build.", "often": "Every new or moved operator. Certification checked daily.", "source": "STS tasks 8 and 17; 10 Sep call.", "gm": "\"He clearly doesn't know the vans. So I need you to stick with him.\" Dave Elliott."}, {"name": "The layered audit", "does": "Auditing the team to its standardized work and recording findings on the level 5 board.", "often": "Weekly.", "source": "STS task 16; roles deck."}, {"name": "Error proofing and process control checks", "does": "Running the 5X5 and error proofing checks and acting on a miss.", "often": "Weekly.", "source": "STS task 14; roles deck."}, {"name": "Standardized work that no longer matches the job", "does": "Noticing the mismatch and raising the change. The engineering turnaround is GM's side.", "often": "Daily upkeep budgeted.", "source": "STS task 9; 10 Sep call."}], "gl": [{"name": "Following one team leader's layered audit", "does": "Doing the weekly layered audit with a team leader and making theirs effective.", "often": "Weekly.", "source": "STS task 6; roles deck; 10 Sep call.", "role": "part", "partOf": "The layered audit"}, {"name": "The team leader's daily checks", "does": "Verifying QFC completion and following up on assignments: workplace organization, TIP, JIT, QFC, layered audit, error proofing.", "often": "Twice daily.", "source": "STS tasks 13 and 45; roles deck.", "role": "part", "partOf": "The daily quality focus check (QFC)"}, {"name": "Validating job instruction training", "does": "Watching a team leader train an operator, and coaching.", "often": "Three times a week.", "source": "STS task 7; roles deck.", "role": "part", "partOf": "A new operator on an unfamiliar job"}, {"name": "Quality alarms and the repeat andon", "does": "Responding to station alarms and driving the repeat issue to cause with the team leader.", "often": "Three alarms a day budgeted.", "source": "STS task 23; roles deck.", "role": "own"}, {"name": "Active problem solving", "does": "Following up every active practical problem solving (PPS) case with the team leaders.", "often": "Daily.", "source": "STS task 20; roles deck.", "role": "own"}, {"name": "The weekly quality review with the shift leader", "does": "Reviewing the GCA and 5F results, GM's quality review inputs, and carrying concerns up and down the line.", "often": "Weekly.", "source": "STS task 24; roles deck.", "role": "own"}, {"name": "Engineering and production changes", "does": "Getting changes into the team leaders' standardized work.", "often": "Weekly.", "source": "STS task 26.", "role": "own"}], "tm": [{"name": "The andon pull", "does": "\"Signal out-of-standards conditions (use Andon).\"", "often": "", "source": "Roles deck, team member slide."}]}}, {"id": "rc", "name": "Responsiveness and Cost", "letter": "R and C", "line": "GM's two columns for uptime and scrap. Responsiveness is the reaction to a stop. Cost is scrap and waste.", "cells": {"tl": [{"name": "Start and end of shift", "does": "Checking material, verifying people on jobs, walking the team.", "often": " S tasks 10 and 25; roles deck.", "role": "part", "partOf": "The level 5 board and the daily huddle"}, {"name": "Manpower at the start of the shift", "does": "Placing absentee replacements and following the absence policy the same way every time. The policy is GM's side.", "often": "Daily.", "source": "Roles deck; roster; STS task 42.", "role": "own"}, {"name": "Downtime and the TIP report", "does": "Updating the report daily, reading andon data with the team, bringing the bottleneck to the weekly TIP.", "often": "Daily and weekly.", "source": "STS tasks 35 and 36; roles deck.", "role": "own"}, {"name": "Material delivery issues", "does": "Responding to late deliveries, dolly exchanges and excess stock, and fixing the recurring ones.", "often": "Four a day budgeted.", "source": "STS task 32; roles deck.", "role": "own"}, {"name": "Scrap and the daily NTR goal", "does": "Running the scrap process with the team leaders and managing to the daily cost target (NTR).", "often": "Daily.", "source": "STS task 41; roles deck.", "role": "own"}, {"name": "The shift handover", "does": "The start of shift, first break and end of shift meetings, and the handover to the next shift's group leaders.", "often": "Daily.", "source": "STS tasks 12, 29 and 30.", "role": "own"}, {"name": "The PMP audit", "does": "Auditing the operators' maintenance checks (PMP) at the stations and the weekly sheets.", "often": "Weekly.", "source": "Roles deck; STS tasks 39 and 40.", "role": "part", "partOf": "Confirming the operators' PMP checks"}], "tm": [{"name": "The PMP tasks", "does": "\"Perform TPM/PMP tasks in adherence to the National Agreement.\"", "often": "", "source": "Roles deck, team member slide."}, {"name": "Workstation readiness", "does": "\"Check workstation readiness for production.\"", "often": "", "source": "Roles deck, team member slide."}]}}], "band": {"title": "Cuts across every cell. Tracked, not built.", "note": "These show up inside every initiative above. They are how the work gets done, not work of their own.", "items": [{"id": "example", "name": "Setting the example", "line": "Knowing and following the rules, wearing PPE, \"making Safety an Overriding Priority\".", "example": {"practice": "Doing the Take 2 with the operator at the observed station", "p": "safety", "a": "tl", "item": "The safety observation tour", "ev": "\"Sets the example by using PPE, tools, equipment and ergo assists.\" Roles deck."}}, {"id": "values", "name": "Values", "line": "The purposes, values and mission statements. Integrity, trust and respect.", "example": {"practice": "Claiming the repair before it leaves the footprint", "p": "quality", "a": "tl", "item": "Repairs in the area", "ev": "\"Oh, that's not my repair.\" Dave Elliott."}}, {"id": "comms", "name": "Communication", "line": "Two-way and three-way communication. Keeping people informed. Open communication.", "example": {"practice": "Setting the day's expectation without narrowing the job", "p": "quality", "a": "tl", "item": "A new operator on an unfamiliar job", "ev": "\"You said I have to do this.\" Dave Elliott, on the union mindset."}}, {"id": "coaching", "name": "Coaching and leading people", "line": "Coaching, setting expectations, empowering, recognition. Being with the teams rather than at the desk.", "gm": "\"Every group leader has different expectations.\" Mariam Ellinger-Baker.", "example": {"practice": "Asking what the audit found before saying what you saw", "p": "quality", "a": "gl", "item": "Following one team leader's layered audit", "ev": "\"Ensures Team Leader conducts effective layered audits, coach as needed.\" Roles deck."}}, {"id": "decision", "name": "Decision making and escalation", "line": "Choosing in the moment, and knowing what to settle at your own level and what to escalate.", "example": {"practice": "Deciding at the tone: fix it, send the replacement, or call maintenance, before the stop", "p": "quality", "a": "tl", "item": "The andon call", "ev": "The board blinks before it fety-critical elements", "Hazard assessments and PPE instructions"]}]}, "quality": {"tl": [{"name": "Defects leaving the area", "items": ["The andon call", "Repairs in the area", "The daily quality focus check (QFC)"]}, {"name": "New and moved operators", "items": ["A new operator on an unfamiliar job"]}, {"name": "Standardized work", "items": ["The layered audit", "Error proofing and process control checks", "Standardized work that no longer matches the job"]}], "gl": [{"name": "The team leaders' response and checks", "items": ["Quality alarms and the repeat andon", "The team leader's daily checks", "Following one team leader's layered audit"]}, {"name": "Training", "items": ["Validating job instruction training"]}, {"name": "Standardized work", "items": ["Engineering and production changes"]}, {"name": "Repeat issues", "items": ["Active problem solving", "The weekly quality review with the shift leader"]}]}, "rc": {"tl": [{"name": "Getting there before the line stops", "items": ["Who is in the hole", "The first response to a maintenance or parts issue", "The repeat stoppage"]}, {"name": "Start and end of shift", "items": ["Start and end of shift", "Confirming the operators' PMP checks"]}, {"name": "The board and the weekly TIP", "items": ["The level 5 board and the daily huddle", "Downtime and the throughput improvement process (TIP)"]}, {"name": "Scrap", "items": ["The day's scrap"]}], "gl": [{"name": "The daily review and the handover", "items": ["The daily BPD review with each team leader", "The shift handover"]}, {"name": "Downtime and material", "items": ["Downtime and the TIP report", "Material delivery issues"]}, {"name": "Manpower", "items": ["Manpower at the start of the shift"]}, {"name": "Scrap and maintenance checks", "items": ["Scrap and the daily NTR goal", "The PMP audit"]}]}}};
const $ = (s, r=document) => r.querySelector(s);
const el = (t, cls, txt) => { const e=document.createElement(t); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; };

const state = { tab: 0, slide: 0, sort: false, open: new Set(), sorts: {} };
const KEY = (p,a) => `${p}-${a}`;
const audIds = DATA.audiences.map(a=>a.id);
function groupsFor(pid,aid){ return ((DATA.groups||{})[pid]||{})[aid]||null; }
/* ---------- header ---------- */
$('#eyebrow').textContent = DATA.title;
$('#h1').textContent = DATA.subtitle;
$('#built').textContent = DATA.built;
const howLabels = ['What a list is','What to do','What it gives'];
DATA.how.forEach((line,i)=>{ const p=el('p'); p.append(el('b',null,howLabels[i]), document.createTextNode(line)); $('#how').append(p); });

(function overview(){
  const g=$('#overview');
  g.append(el('div','hd',''));
  DATA.audiences.forEach(a=>g.append(el('div','hd',a.name)));
  DATA.programs.forEach((p,pi)=>{
    const lab=el('div','rowlab'); lab.append(el('span',null,p.name)); g.append(lab);
    DATA.audiences.forEach((a,ai)=>{
      const wrap=el('div'); const b=el('button','cell'+(a.id==='tm'?' dim':'')); b.type='button'; b.dataset.aud=a.name;
      const n=(p.cells[a.id]||[]).length;
      b.append(el('span','n',String(n)), el('span','open', a.id==='tm' ? 'named, not listed' : 'open'));
      b.setAttribute('aria-label',`${p.name}, ${a.name}: ${n} items`);
      b.addEventListener('click',()=>{ go(pi,ai); $('#tabs').scrollIntoView({behavior:'smooth',block:'start'}); });
      wrap.append(b); g.append(wrap);
    });
  });
  const L=$('#legend');
  const s1=el('span'); s1.append(el('i','dot'), document.createTextNode(DATA.legend.gap));
  L.append(s1);
})();

/* ---------- tabs ---------- */
const tabsEl=$('#tabs');
DATA.programs.forEach((p,i)=>{
  const b=el('button','tab'); b.type='button'; b.setAttribute('role','tab'); b.id='tab-'+p.id;
  b.append(document.createTextNode(p.name));
  b.addEventListener('click',()=>go(i,state.slide));
  tabsEl.append(b);
});
const segEl=$('#seg');
DATA.audiences.forEach((a,i)=>{
  const b=el('button',null,a.name); b.type='button'; b.setAttribute('role','tab'); b.addEventListener('click',()=>go(state.tab,i)); segEl.append(b);
});
$('#sortbtn').addEventListener('click',()=>{ state.sort=!state.sort; renderSlide(); });

function go(t,s){ state.tab=t; state.slide=s; renderSlide(); snapshot(); }

/* ---------- the slide ---------- */
function currentItems(){
  const p=DATA.programs[state.tab], a=audIds[state.slide];
  const items=(p.cells[a]||[]).slice();
  const saved=state.sorts[KEY(p.id,a)];
  if(saved && Array.isArray(saved.order)){
    const byName=new Map(items.map(i=>[i.name,i]));
    const ordered=saved.order.map(n=>byName.get(n)).filter(Boolean);
    items.forEach(i=>{ if(!ordered.includes(i)) ordered.push(i); });
    return ordered;
  }
  return items;
}
function renderSlide(){
  const p=DATA.programs[state.tab], a=DATA.audiences[state.slide], aid=a.id;
  [...tabsEl.children].forEach((b,i)=>b.setAttribute('aria-selected',String(i===state.tab)));
  [...segEl.children].forEach((b,i)=>b.setAttribute('aria-selected',String(i===state.slide)));
  $('#pline').textContent=p.line;
  $('#who').textContent=a.who;
  const sortable = aid!=='tm';
  $('#sortbtn').style.visibility = sortable ? 'visible' : 'hidden';
  $('#sortbtn').setAttribute('aria-pressed',String(state.sort && sortable));
  $('#sortbtn').textContent = state.sort && sortable ? 'Done sorting' : 'Sort this list';
  $('#slide').dataset.sort = String(state.sort && sortable);
  const key=KEY(p.id,aid), saved=state.sorts[key]||{order:null,why:{}};
  const ul=$('#items'); ul.innerHTML='';
  const flat=currentItems();
  const groups=groupsFor(p.id,aid);
  const blocks = groups ? groups.map(g=>({name:g.name, items:flat.filter(i=>g.items.includes(i.name))})).filter(b=>b.items.length) : [{name:null, items:flat}];
  const grouped=flat.filter(i=>!blocks.some(b=>b.items.includes(i))); if(grouped.length) blocks.push({name:null, items:grouped});
  blocks.forEach(block=>{
  if(block.name) ul.append(el('li','group-hd',block.name));
  const items=block.items;
  items.forEach((it,idx)=>{
    const li=el('li','item'); li.dataset.open=String(state.open.has(key+'|'+it.name));
    const head=el('button','item-head'); head.type='button'; head.setAttribute('aria-expanded',li.dataset.open);
    head.append(el('span','num', sortable ? String(idx+1).padStart(2,'0') : '·'));
    const name=el('span','name'); name.append(document.createTextNode(it.name));
    if(it.gm){ const d=el('i','dot'); d.title=DATA.legend.gap; name.append(d); }
    head.append(name, el('span','chev','›'));
    head.addEventListener('click',()=>{ const k=key+'|'+it.name; state.open.has(k)?state.open.delete(k):state.open.add(k); renderSlide(); });
    li.append(head);

    const det=el('div','detail');
    const grid=el('div','dgrid');
    const d1=el('div'); d1.append(el('span','lab', aid==='tm' ? 'GM’s words' : 'What they do'), document.createTextNode(it.does)); grid.append(d1);
    if(it.often){ const d2=el('div'); d2.append(el('span','lab','How often'), document.createTextNode(it.often)); grid.append(d2); }
    const d3=el('div'); d3.append(el('span','lab','Where GM wrote it'), document.createTextNode(it.source)); grid.append(d3);
    det.append(grid);
    if(it.gm){ const q=el('div','gmq'); q.append(el('span','lab','GM, 10 September'), el('p',null,it.gm)); det.append(q); }
    if(it.fold){ det.append(el('p','fold',it.fold)); }
    li.append(det);

    if(sortable){
      const row=el('div','sortrow');
      const up=el('button','mv','↑'); up.type='button'; up.disabled=idx===0; up.setAttribute('aria-label','Move up');
      const dn=el('button','mv','↓'); dn.type='button'; dn.disabled=idx===items.length-1; dn.setAttribute('aria-label','Move down');
      up.addEventListener('click',()=>move(key,blocks,block,idx,-1)); dn.addEventListener('click',()=>move(key,blocks,block,idx,1));
      const why=el('input','why'); why.type='text'; why.id='why-'+key+'-'+idx; why.placeholder='Why here, in one line'; why.value=(saved.why&&saved.why[it.name])||'';
      why.addEventListener('input',()=>{ const s=ensure(key,flat); s.why[it.name]=why.value; save(key); });
      row.append(up,dn,why); li.append(row);
    }
    ul.append(li);
  });
  });
  $('#copyout').classList.remove('show');
  showStatus();
}
function ensure(key,items){ if(!state.sorts[key]) state.sorts[key]={order:items.map(i=>i.name),why:{}}; if(!state.sorts[key].why) state.sorts[key].why={}; return state.sorts[key]; }
function move(key,blocks,block,idx,dir){
  const j=idx+dir; if(j<0||j>=block.items.length) return;
  [block.items[idx],block.items[j]]=[block.items[j],block.items[idx]];
  const flat=blocks.flatMap(b=>b.items); const s=ensure(key,flat); s.order=flat.map(i=>i.name); save(key); renderSlide();
}

/* ---------- copy ---------- */
$('#copy').addEventListener('click',async()=>{
  const p=DATA.programs[state.tab], a=DATA.audiences[state.slide], key=KEY(p.id,a.id);
  const s=state.sorts[key]||{why:{}};
  const lines=[`${DATA.title}. ${p.name}. ${a.name}.`,'Most to least promising:'];
  const flat=currentItems(), groups=groupsFor(p.id,a.id);
  const blocks = groups ? groups.map(g=>({name:g.name, items:flat.filter(i=>g.items.includes(i.name))})).filter(b=>b.items.length) : [{name:null, items:flat}];
  blocks.forEach(b=>{ if(b.name) lines.push('', b.name); b.items.forEach((it,i)=>{ const w=(s.why&&s.why[it.name])?` Why: ${s.why[it.name]}`:''; lines.push(`${i+1}. ${it.name}.${w}`); }); });
  const text=lines.join('\n');
  const out=$('#copyout'); out.value=text; out.classList.add('show');
  let ok=false; try{ await navigator.clipboard.writeText(text); ok=true; }catch(e){}
  $('#status').textContent = ok ? 'Copied. The text is also below.' : 'Select the text below and copy it.';
});

/* ---------- persistence: shared when the page can, this device otherwise ---------- */
const store={db:null,timers:{}};
const LS='gm-wentzville-sorts';
function loadLocal(){ try{ const j=JSON.parse(localStorage.getItem(LS)||'{}'); Object.assign(state.sorts,j); }catch(e){} }
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(state.sorts)); }catch(e){} }
function showStatus(msg){
  const st=$('#status'); if(msg){ st.textContent=msg; return; }
  st.textContent = store.db ? 'Sorts save for everyone who opens this page.' : 'Sorts save on this device only.';
}
function save(key){
  saveLocal();
  clearTimeout(store.timers[key]);
  store.timers[key]=setTimeout(async()=>{
    if(!store.db) return;
    try{ const s=state.sorts[key]; await store.db.doc('sorts/'+key).set({order:s.order||[],why:s.why||{},savedAt:new Date().toISOString()}); showStatus('Saved for everyone who opens this page.'); }
    catch(e){ showStatus('The shared save failed. Kept on this device.'); }
  },700);
}
async function initShared(){
  try{
    if(!window.claude || typeof window.claude.use!=='function') return;
    const db=await window.claude.use('db'); if(!db) return;
    store.db=db;
    const snap=await db.collection('sorts').get();
    snap.docs.forEach(d=>{ const b=d.data(); if(b&&Array.isArray(b.order)) state.sorts[d.id]={order:b.order,why:(b.why&&typeof b.why==='object')?b.why:{}}; });
    saveLocal(); renderSlide();
  }catch(e){ /* stays on this device */ }
}
function snapshot(){ try{ window.claude?.hot?.snapshot?.(()=>({tab:state.tab,slide:state.slide,sort:state.sort})); }catch(e){} }

/* ---------- band and left-off ---------- */
(function band(){
  const b=$('#band'); b.append(el('span','eyebrow','Horizontal'), el('h2',null,DATA.band.title), el('p','note',DATA.band.note));
  const chips=el('div','chips');
  DATA.band.items.forEach(it=>{
    const d=el('details'); d.dataset.comp=it.id; d.append(el('summary',null,it.name));
    const body=el('div','body'); body.append(el('p',null,it.line)); if(it.gm) body.append(el('p','gm',it.gm));
    const x=it.example; if(x){
      const pi=DATA.programs.findIndex(q=>q.id===x.p), ai=audIds.indexOf(x.a); const prog=DATA.programs[pi], aud=DATA.audiences[ai];
      const ex=el('div','ex'); ex.append(el('span','lab',DATA.band.appears), el('p','pn',x.practice));
      const w=el('button','where',`${prog.name} · ${aud.name} · ${x.item} ›`); w.type='button';
      w.addEventListener('click',()=>{ state.open.add(KEY(x.p,x.a)+'|'+x.item); go(pi,ai); $('#tabs').scrollIntoView({behavior:'smooth',block:'start'}); });
      ex.append(w, el('p','ev',x.ev)); body.append(ex);
    }
    d.append(body); chips.append(d);
  });
  b.append(chips);
  const lo=$('#leftoff'); lo.append(el('summary',null,DATA.leftOff.title));
  const dl=el('dl'); DATA.leftOff.items.forEach(it=>{ dl.append(el('dt',null,it.name), el('dd',null,it.line)); }); lo.append(dl);
})();

/* ---------- boot ---------- */
function start(hot){
  if(hot && typeof hot.tab==='number'){ state.tab=hot.tab; state.slide=hot.slide||0; state.sort=!!hot.sort; }
  loadLocal(); renderSlide(); initShared(); snapshot();
}
try{ (window.claude?.hot?.ready) ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}); }catch(e){ start({}); }
</script>
